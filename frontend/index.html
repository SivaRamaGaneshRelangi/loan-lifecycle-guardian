<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loan Lifecycle Guardian</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#162033;--mut:#667085;--pri:#2457d6;--pri2:#e8eefc;--ok:#12805c;--bad:#c0392b;--warn:#b7791f;--line:#e3e8f2;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1320;--card:#161d2e;--ink:#e8ecf5;--mut:#9aa6bd;--line:#27304a;--pri2:#1c2745;--sh:none}}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--pri);color:#fff;position:sticky;top:0;z-index:20}
header .brand{font-weight:700;font-size:16px}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;max-width:1300px;margin:0 auto;padding:16px}
@media(max-width:820px){.shell{grid-template-columns:1fr}#side{display:flex;overflow-x:auto;position:static!important}}
#side{position:sticky;top:64px;align-self:start;display:flex;flex-direction:column;gap:4px}
#side button{background:transparent;color:var(--ink);text-align:left;padding:9px 12px;border-radius:8px;white-space:nowrap;font-weight:500}
#side button:hover{background:var(--pri2)}#side button.on{background:var(--pri);color:#fff}
#side .cnt{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3,.card h4{margin:0 0 10px}
h2.pg{margin:2px 0 12px;font-size:20px}
button{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600}
button:hover{filter:brightness(1.08)}button.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.bad{background:var(--bad)}button.ok{background:var(--ok)}button.sm{padding:4px 9px;font-size:12px}button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);margin:3px 0 8px;font:inherit}
label.f{display:block;font-size:12px;color:var(--mut);font-weight:600}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--sh)}
.kpi .l{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}.kpi .v{font-size:22px;font-weight:700;margin-top:4px}.kpi .s{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-size:12px}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;background:var(--mut)}
.APPROVE,.PAID,.APPROVED,.ACTIVE,.VERIFIED,.HIGH,.SUCCESS,.CLOSED,.CLOSED_EARLY{background:var(--ok)}
.REJECT,.REJECTED,.FAILED,.OVERDUE,.NOT_ELIGIBLE,.FROZEN{background:var(--bad)}
.REVIEW,.NEED_DOCS,.NEED_INFO,.UPLOADED,.MEDIUM,.PENDING,.MISSING{background:var(--warn)}.LOW{background:#c05621}
.pass{color:var(--ok)}.fail{color:var(--bad)}.soft{color:var(--warn)}.mut{color:var(--mut)}.small{font-size:12px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri)}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line)}.stack i{display:block;height:100%}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:20px}
.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.err{color:var(--bad);margin:6px 0}.note{background:var(--pri2);border-radius:8px;padding:10px;font-size:13px}
.opt{border-left:5px solid var(--line)}.opt.HIGH{border-left-color:var(--ok)}.opt.MEDIUM{border-left-color:var(--warn)}.opt.LOW{border-left-color:#c05621}.opt.NOT_ELIGIBLE{border-left-color:var(--bad);opacity:.85}
.doc{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;flex-wrap:wrap}
.chk{margin:4px 0 0 0;padding:0;list-style:none;font-size:12px}
pre{white-space:pre-wrap;margin:6px 0;font:inherit}
#fab{position:fixed;right:18px;bottom:18px;z-index:30;border-radius:99px;padding:12px 16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#chatbox{position:fixed;right:18px;bottom:70px;width:370px;max-width:calc(100vw - 36px);z-index:30;display:none}
#chatbox.open{display:block}#chat{height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;white-space:pre-wrap;background:var(--bg)}
.me{color:var(--pri);margin:4px 0}.bot{margin:4px 0}
#toasts{position:fixed;top:70px;right:16px;z-index:50;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;max-width:340px;box-shadow:0 4px 14px rgba(0,0,0,.25)}.toast.err{background:var(--bad);color:#fff}.toast.ok{background:var(--ok);color:#fff}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;cursor:pointer;margin:2px 4px 2px 0;background:var(--card)}
</style></head><body>
<header><span class="brand">🏦 Loan Lifecycle Guardian</span><span id="who"></span></header>
<div id="toasts"></div>
<div class="shell"><nav id="side"></nav><main id="view"></main></div>
<button id="fab" onclick="toggleChat()" style="display:none">🤖 Ask Guardian</button>
<div id="chatbox" class="card" style="display:none"><b>🤖 Guardian assistant</b> <span id="mode" class="mut"></span>
 <div id="chat"></div>
 <div id="chips"></div>
 <input id="msg" placeholder="Ask about EMI, auto-pay, which loan suits me…" onkeydown="if(event.key==='Enter')send()">
 <button onclick="send()">Send</button></div>
<script>
const $=s=>document.querySelector(s);
let token=localStorage.tok,me=null,hist=[],prefill=null,PRODUCTS=[],DD=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const pct=x=>(x*100).toFixed(0)+'%';
const badge=(s,t)=>`<span class="b ${esc(s)}">${esc(t||s)}</span>`;
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const DOCS=['ID_PROOF','ADDRESS_PROOF','INCOME_PROOF','PROPERTY_PAPERS','VEHICLE_QUOTATION','ADMISSION_LETTER','GOLD_VALUATION'];
function toast(m,k=''){const t=document.createElement('div');t.className='toast '+k;t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4500)}
function fail(d){return Array.isArray(d.detail)?d.detail.map(x=>(x.loc||[]).slice(-1)+': '+x.msg).join('; '):(d.detail||'Error')}
async function api(p,m='GET',b){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:b?JSON.stringify(b):undefined});
 const d=await r.json().catch(()=>({}));if(r.status===401&&token&&!p.startsWith('/auth')){logout();}
 if(!r.ok)throw new Error(fail(d));return d}
async function upload(p,fd){const r=await fetch('/api'+p,{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(fail(d));return d}
async function blobOf(p){const r=await fetch('/api'+p,{headers:{Authorization:'Bearer '+token}});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(fail(d))}return r.blob()}
const wrap=f=>async(...a)=>{try{await f(...a)}catch(e){toast(e.message,'err')}};
const openFile=wrap(async p=>{const b=await blobOf(p);window.open(URL.createObjectURL(b),'_blank')});
const saveFile=wrap(async(p,n)=>{const b=await blobOf(p);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()});
const show=h=>$('#view').innerHTML=h;
function logout(){localStorage.removeItem('tok');token=null;me=null;hist=[];boot()}

/* ---------- boot / nav ---------- */
const NAV={CUSTOMER:[['home','🏠 Home'],['loans','💳 My loans'],['apply','📝 Apply'],['fit','🎯 Best loan for me'],['docs','📁 Documents'],['apps','📋 Applications'],['calc','🧮 EMI calculator'],['profile','👤 Profile'],['myrequests','🛎️ Support requests'],['notifs','🔔 Notifications']],
 OFFICER:[['dashboard','📊 Dashboard'],['queue','📥 Queue'],['collections','💰 Collections'],['requests','🛎️ Requests']],ADMIN:[['dashboard','📊 Dashboard'],['queue','📥 Queue'],['collections','💰 Collections'],['requests','🛎️ Requests'],['passwordRequests','🔐 Password Reset Requests'],['admin','⚙️ Admin']]};
async function boot(){
 if(token){try{me=await api('/auth/me')}catch{token=null}}
 if(!me){$('#who').innerHTML='';$('#side').innerHTML='';$('#fab').style.display='none';$('#chatbox').style.display='none';return loginView()}
 $('#who').innerHTML=`${esc(me.full_name)} · <b>${me.role}</b> <button class="alt sm" style="color:#fff;border-color:#fff" onclick="logout()">Logout</button>`;
 $('#fab').style.display='block';$('#chatbox').style.display='';
 $('#side').innerHTML=NAV[me.role].map(([k,l])=>`<button data-t="${k}" onclick="go('${k}')">${l}<span class="cnt" id="c_${k}" style="display:none"></span></button>`).join('');
 go(NAV[me.role][0][0]);refreshBadge()}
async function refreshBadge(){if(me&&me.role==='CUSTOMER'){try{const n=(await api('/me/notifications')).filter(x=>!x.is_read).length;const c=$('#c_notifs');if(c){c.textContent=n;c.style.display=n?'':'none'}}catch{}}  if (me.role === 'ADMIN') {
    try {
      const requests = await api('/admin/password-reset-requests');
      const count = requests.filter(
        r => r.status === 'PENDING'
      ).length;

      const c = $('#c_passwordRequests');
      if (c) {
        c.textContent = count > 99 ? '99+' : count;
        c.style.display = count ? '' : 'none';
      }
    } catch {}
  }
}
function go(t){document.querySelectorAll('#side button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));wrap(P[t])().then(refreshBadge)}

function loginView(){
  show(`<div class="card" style="max-width:430px;margin:30px auto">
    <h3>Sign in</h3>
    <div id="err" class="err"></div>

    <label class="f">Username</label>
    <input id="u" autocomplete="username">

    <label class="f">Password</label>
    <input id="p" type="password"
      autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()">

    <button onclick="doLogin()">Login</button>
    <button class="alt" onclick="regView()">Register as customer</button>

    <p style="text-align:right;margin-top:12px">
      <a href="#" onclick="forgotPasswordView();return false;"
         style="color:var(--pri);font-weight:600">
        Forgot Password?
      </a>
    </p>

    <p class="mut small">
      Demo: admin/Admin@123 · officer1/Officer@123 ·
      rahul | priya | suresh | anita | vikram / Cust@1234
    </p>
  </div>`);
}


function forgotPasswordView(){
  show(`<div class="card" style="max-width:430px;margin:30px auto">
    <h3>Forgot Password?</h3>
    <p>Enter your username to request a password reset.</p>

    <div id="forgot-err" class="err"></div>

    <form id="forgot-form">
      <label class="f">Username</label>
      <input id="forgot-username"
        autocomplete="username"
        required
        minlength="4"
        maxlength="30"
        placeholder="Enter your username">

      <button type="submit" id="forgot-submit">
        Submit Reset Request
      </button>

      <button type="button" class="alt"
        onclick="loginView()">
        Back to Login
      </button>
    </form>

    <p class="mut small">
      Your request will be sent to the administrator for review.
    </p>
  </div>`);

  $('#forgot-form').addEventListener('submit', async event => {
    event.preventDefault();

    const username = $('#forgot-username').value.trim();
    const button = $('#forgot-submit');
    const error = $('#forgot-err');

    error.textContent = '';
    button.disabled = true;

    try {
      await api('/auth/password-reset-requests', 'POST', {
        username: username
      });

      show(`<div class="card" style="max-width:430px;margin:30px auto">
        <h3>Request Submitted</h3>
        <p>Your password-reset request has been submitted
        for administrator review.</p>
        <p class="mut small">
          Please wait for the administrator's response before
          attempting to sign in with a temporary password.
        </p>
        <button onclick="loginView()">Back to Login</button>
      </div>`);
    } catch (e) {
      error.textContent =
        e.message || 'Unable to submit your request.';
      button.disabled = false;
    }
  });
}


const doLogin=async()=>{try{const r=await api('/auth/login','POST',{username:$('#u').value,password:$('#p').value});token=r.token;localStorage.tok=token;boot()}catch(e){$('#err').textContent=e.message}};
function regView(){const f=(id,l,t='text')=>`<label class="f">${l}</label><input id="${id}" type="${t}">`;
 show(`<div class="card" style="max-width:540px;margin:20px auto"><h3>Customer registration</h3><div id="err" class="err"></div>
 ${f('r_u','Username (4-30, letters/digits/_)')}${f('r_p','Password (8+, letters & digits)','password')}${f('r_n','Full name')}${f('r_e','Email')}
 ${f('r_d','Date of birth','date')} ${f('r_ph','Phone (10 digits)','tel')}${f('r_ad','Address')}${f('r_ci','City')}${f('r_pi','Pincode (6 digits)')}${f('r_pan','PAN (ABCDE1234F)')}${f('r_i','Monthly income (₹)','number')}${f('r_x','EMIs you pay to OTHER lenders per month (₹)','number')}
 <label class="f">Employment</label><select id="r_t"><option>SALARIED</option><option>SELF_EMPLOYED</option></select>
 <button onclick="doReg()">Create account</button> <button class="alt" onclick="boot()">Back</button></div>`)}
const doReg=async()=>{try{const r=await api('/auth/register','POST',{username:$('#r_u').value,password:$('#r_p').value,full_name:$('#r_n').value,email:$('#r_e').value,dob:$('#r_d').value,phone:$('#r_ph').value,address:$('#r_ad').value,city:$('#r_ci').value,pincode:$('#r_pi').value,pan:$('#r_pan').value.toUpperCase(),monthly_income:+$('#r_i').value,existing_emi:+$('#r_x').value||0,employment_type:$('#r_t').value});token=r.token;localStorage.tok=token;boot()}catch(e){$('#err').textContent=e.message}};

/* ---------- shared helpers ---------- */
function docState(list){const s={};for(const d of list){if(d.status==='REJECTED')continue;if(d.status==='VERIFIED')s[d.doc_type]='VERIFIED';else if(s[d.doc_type]!=='VERIFIED')s[d.doc_type]='PENDING'}return s}
const stateIcon=s=>s==='VERIFIED'?'<span class="pass">✔ verified</span>':s==='PENDING'?'<span class="soft">⏳ awaiting review</span>':'<span class="fail">✖ missing</span>';
function obligationBar(o,income){if(!o)return'';const tot=o.other_lenders+o.our_active_loans+o.new_emi;const w=x=>Math.min(100,x/income*100).toFixed(1);
 return `<div class="small mut">Monthly obligations vs income ${inr(income)}</div><div class="stack"><i style="width:${w(o.other_lenders)}%;background:#8b9bb8" title="Other lenders"></i><i style="width:${w(o.our_active_loans)}%;background:#d69e2e" title="Our active loans"></i><i style="width:${w(o.new_emi)}%;background:var(--pri)" title="New EMI"></i></div>
 <div class="small mut">⬜ other lenders ${inr(o.other_lenders)} · 🟨 our active loans ${inr(o.our_active_loans)} · 🟦 new EMI ${inr(o.new_emi)} = <b>${pct(tot/income)}</b> of income</div>`}
const checksHtml=r=>`<p>${badge(r.recommendation)} readiness score <b>${r.score}</b> · EMI <b>${inr(r.emi)}</b> @ ${r.rate}% · FOIR ${pct(r.foir)}</p>${obligationBar(r.obligations,r.obligations?r.obligations.income:1)}<table>${r.checks.map(c=>`<tr><td class="${c.passed?'pass':c.severity==='soft'?'soft':'fail'}" style="width:24px">${c.passed?'✔':'✖'}</td><td>${esc(c.name)}</td><td class="mut">${esc(c.detail)}</td></tr>`).join('')}</table>`;
const ring=(score)=>{const p=Math.max(0,Math.min(100,(score-300)/6));return `<div class="ring" style="background:conic-gradient(var(--pri) ${p*3.6}deg,var(--line) 0)"><div>${score}</div></div>`};


/* ---------- customer: home ---------- */
const P = {};

P.home = async () => {
  const [pr, loans, dd, insights] = await Promise.all([
    api('/me/profile'),
    api('/me/loans'),
    api('/me/documents'),
    api('/me/insights')
  ]);

  const act = loans.filter(l => l.status === 'ACTIVE');

  const emi = act.reduce((s, l) => s + l.emi, 0);
  const out = act.reduce((s, l) => s + l.outstanding, 0);

  const due = act
    .filter(l => l.next_due)
    .sort((a, b) =>
      a.next_due.due_date.localeCompare(b.next_due.due_date)
    )[0];

  const c = pr.credit;
  const alerts = [];

  act.forEach(l => {
    if (l.overdue_count) {
      alerts.push(
        `⚠️ ${esc(l.product_name)} #${l.id}: ` +
        `${l.overdue_count} EMI(s) failed/overdue. ` +
        `<a href="#" onclick="go('loans');return false">Fix it</a>`
      );
    } else if (!l.autopay_enabled) {
      alerts.push(
        `ℹ️ Auto-pay is OFF for ${esc(l.product_name)} #${l.id}.`
      );
    }
  });

  const st = docState(dd.documents);

  if (!Object.keys(st).length) {
    alerts.push(
      '📁 Upload your documents once - they are reused for every application. ' +
      '<a href="#" onclick="go(\'docs\');return false">Open locker</a>'
    );
  }

  if (!pr.kyc_verified) {
    alerts.push(
      '🪪 KYC is pending - an officer will verify it when you apply.'
    );
  }

  show(`
    <h2 class="pg">
      Hello, ${esc(pr.full_name.split(' ')[0])} 👋
    </h2>

    <div class="kpis">
      <div class="kpi">
        <div class="l">Outstanding</div>
        <div class="v">${inr(out)}</div>
        <div class="s">${act.length} active loan(s)</div>
      </div>

      <div class="kpi">
        <div class="l">Monthly EMIs (all)</div>
        <div class="v">${inr(pr.obligations.total)}</div>
        <div class="s">
          ${
            pr.obligations.ratio == null
              ? ''
              : pct(pr.obligations.ratio) +
                ' of income · our loans ' + inr(emi)
          }
        </div>
      </div>

      <div class="kpi">
        <div class="l">Next EMI</div>
        <div class="v">${due ? inr(due.next_due.emi) : '-'}</div>
        <div class="s">
          ${
            due
              ? esc(due.next_due.due_date) +
                ' · ' + esc(due.product_name)
              : 'No dues'
          }
        </div>
      </div>

      <div class="kpi">
        <div class="l">Credit score</div>
        <div class="v">${c.score}</div>
        <div class="s">
          ${esc(c.band)}
          ${
            c.next_threshold
              ? ' · ' + c.points_needed + ' pts to ' + c.next_threshold
              : ''
          }
        </div>
      </div>
    </div>

    ${
      alerts.length
        ? `
          <div class="card">
            <b>Needs your attention</b>
            ${alerts.map(a => `
              <div style="margin-top:6px">${a}</div>
            `).join('')}
          </div>
        `
        : ''
    }

    ${
      insights.length
        ? `
          <div class="card">
            <h3>🤖 Guardian alerts</h3>

            ${insights.map(i => `
              <div class="card" style="margin-top:8px">
                <div class="flex">
                  <b>${esc(i.title)}</b>
                  ${badge(
                    i.severity,
                    String(i.severity || 'INFO').toUpperCase()
                  )}
                </div>

                <p>${esc(i.message)}</p>

                <div class="flex">
                  ${(i.actions || []).map(a => `
                    <button
                      class="alt sm"
                      onclick="guardianAction(
                        '${esc(a.type)}',
                        ${a.loan_id ?? 'null'},
                        ${a.balance_to ?? 'null'},
                        '${esc(a.tab || '')}'
                      )"
                    >
                      ${esc(a.label)}
                    </button>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        `
        : ''
    }

    ${pr.accounts.map(a => `
      <div class="card">
        <div class="flex">
          <b>Account ${esc(a.account_no)}</b>
          ${a.is_frozen ? badge('FROZEN') : ''}
          <span class="sp"></span>
          <span class="mut small">
            Daily debit limit ${inr(a.daily_debit_limit)}
          </span>
        </div>

        <div class="row" style="margin-top:8px">
          <div>
            <span class="mut small">Balance</span><br>
            <b style="font-size:20px">${inr(a.balance)}</b>
          </div>

          <div>
            <span class="mut small">Net banking</span><br>
            <b>${a.netbanking_enabled ? 'ON' : 'OFF'}</b>
          </div>
        </div>

        ${
          dd.demo
            ? `
              <hr style="border:0;border-top:1px solid var(--line)">

/* ---------- Guardian alert actions ---------- */
const guardianAction = wrap(async (type, loanId, balanceTo, tab) => {
  if (type === 'pay_now') {
    if (!confirm('Pay the next EMI now?')) return;

    const r = await api(`/me/loans/${loanId}/pay`, 'POST');

    toast('EMI paid: ' + inr(r.amount), 'ok');

  } else if (type === 'enable_autopay') {
    if (!confirm('Enable auto-pay for this loan?')) return;

    await api(`/me/loans/${loanId}/autopay`, 'POST', {
      enable: true
    });

    toast('Auto-pay enabled', 'ok');

  } else if (type === 'add_funds') {
    if (balanceTo == null) {
      toast('Guardian did not provide a target balance');
      return;
    }

    if (!confirm(
      `Set demo account balance to ${inr(balanceTo)}?`
    )) return;

    await api('/me/accounts/demo', 'POST', {
      balance: balanceTo
    });

    toast('Demo balance updated', 'ok');

  } else if (type === 'enable_netbanking') {
    if (!confirm('Enable net banking in demo mode?')) return;

    await api('/me/accounts/demo', 'POST', {
      netbanking_enabled: true
    });

    toast('Demo net banking enabled', 'ok');

  } else if (type === 'goto') {
    go(tab === 'Applications' ? 'apps' : 'loans');
    return;

  } else {
    toast('Unsupported Guardian action');
    return;
  }

  await P.home();
});

 ${r.map(a=>`<tr><td>${a.id}</td><td>${esc(a.customer.name)}</td><td>${a.product}</td><td>${inr(a.amount)}</td><td>${badge(a.system_recommendation)}</td><td>${a.system_score}</td><td>${badge(a.status)}</td><td><button class="alt sm" onclick="review(${a.id})">Review</button></td></tr>`).join('')||'<tr><td colspan=8>Queue is empty</td></tr>'}</table></div><div id="det"></div>`)};
const review=wrap(async id=>{$('#det').innerHTML='<div class="card mut">Loading AI credit note…</div>';const a=await api('/officer/applications/'+id);const c=a.customer;
 const o={other_lenders:c.existing_emi,our_active_loans:a.bank_obligations,new_emi:a.emi,income:c.income};
 $('#det').innerHTML=`<div class="card"><h3>Application #${a.id} - ${esc(c.name)}</h3><div class="row"><div><span class="mut small">Income</span><br>${inr(c.income)}</div><div><span class="mut small">EMIs elsewhere</span><br>${inr(c.existing_emi)}</div><div><span class="mut small">Our active loans</span><br><b>${inr(a.bank_obligations)}</b></div><div><span class="mut small">Credit score</span><br>${c.credit_score}</div><div><span class="mut small">KYC</span><br>${c.kyc_verified?'✔ verified':'<button class="sm" onclick="kyc('+c.id+','+a.id+')">Verify KYC</button>'}</div><div><span class="mut small">PAN</span><br>${esc(c.pan)}</div></div>
 <p><b>Request:</b> ${a.product} ${inr(a.amount)} / ${a.tenure_months}m @ ${a.rate}% → EMI ${inr(a.emi)} · Purpose: ${esc(a.purpose)||'-'}</p>
 <div class="note"><b>🤖 AI credit note</b> <span class="mut small">(advisory only)</span><pre>${esc(a.ai_summary)}</pre><button class="alt sm" onclick="refSum(${a.id})">Regenerate</button></div></div>
 <div class="card"><h4>Readiness checks</h4>${checksHtml({...a,recommendation:a.system_recommendation,score:a.system_score,obligations:o})}</div>
 <div class="card"><h4>Customer documents</h4>${a.documents.map(d=>`<div class="doc"><div style="flex:1;min-width:240px"><b>${esc(d.label)}</b> ${badge(d.status,d.status==='UPLOADED'?'PENDING REVIEW':d.status)} ${d.source==='SAMPLE'?'<span class="b" style="background:#7c3aed">SAMPLE</span>':''}<div class="mut small">${esc(d.filename)} · ${kb(d.size)}</div>
 <ul class="chk">${d.checks.map(x=>`<li class="${x.passed?'pass':'fail'}">${x.passed?'✔':'✖'} ${esc(x.name)} <span class="mut">- ${esc(x.detail)}</span></li>`).join('')}</ul>${d.review_note?`<div class="small"><b>Note:</b> ${esc(d.review_note)}</div>`:''}</div>
 <div class="flex"><button class="alt sm" onclick="openFile('/officer/documents/${d.id}/file')">View</button>${d.status!=='VERIFIED'?`<button class="ok sm" onclick="docRev(${d.id},'verify',${a.id})">Verify</button>`:''}${d.status!=='REJECTED'?`<button class="bad sm" onclick="docRev(${d.id},'reject',${a.id})">Reject</button>`:''}</div></div>`).join('')||'<p class="mut">No documents uploaded.</p>'}</div>
 ${['SUBMITTED','NEED_INFO'].includes(a.status)?`<div class="card"><h4>Decision</h4><select id="d_d"><option value="approve">Approve & disburse</option><option value="need_info">Request more info</option><option value="reject">Reject</option></select>
 <textarea id="d_n" rows="2" placeholder="Note / reason (required for reject, need info, override)"></textarea>
 <button class="alt sm" onclick="draftOfficerMessage(${a.id})">Draft customer message</button> <span class="mut small">AI draft only; review before sending</span><br><br>
 <label><input type="checkbox" id="d_o" style="width:auto"> Override system recommendation (needs note ≥10 chars)</label><br><br><button onclick="decideApp(${a.id})">Submit decision</button></div>`:`<div class="card">${badge(a.status)}</div>`}`});
const docRev=wrap(async(did,v,aid)=>{let note='';if(v==='reject'){note=prompt('Reason for rejecting (shown to the customer):');if(!note)return}
 await api(`/officer/documents/${did}/review`,'POST',{verdict:v,note});review(aid)});
const kyc=wrap(async(uid,id)=>{await api(`/officer/customers/${uid}/kyc`,'POST');review(id)});
const refSum=wrap(async id=>{await api(`/officer/applications/${id}/summary/refresh`,'POST');review(id)});
const decideApp=wrap(async id=>{await api(`/officer/applications/${id}/decision`,'POST',{decision:$('#d_d').value,note:$('#d_n').value,override:$('#d_o').checked});toast('Decision saved','ok');P.queue()});
const draftOfficerMessage=wrap(async id=>{const r=await api(`/officer/applications/${id}/draft-message`,'POST',{goal:$('#d_d').value});$('#d_n').value=r.draft;toast('Draft inserted into note box; review it before using','ok')});

P.passwordRequests = async () => {
  const response = await api('/admin/password-reset-requests');
  const requests = Array.isArray(response) ? response : [];
  const pending = requests.filter(r => r.status === 'PENDING');

  show(`
    <h2 class="pg">Password Reset Requests</h2>

    <div class="card">
      <div class="flex">
        <div>
          <h3>Customer requests</h3>
          <p class="mut small">
            Review requests and approve or reject them.
          </p>
        </div>
        <span class="sp"></span>
        <span class="b PENDING">${pending.length} pending</span>
        <button class="alt sm"
          onclick="go('passwordRequests')">Refresh</button>
      </div>

      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Request ID</th>
              <th>Customer</th>
              <th>Submitted</th>
              <th>Status</th>
              <th>Reviewed</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${requests.map(r => `
              <tr>
                <td>#${r.id}</td>
                <td>${esc(r.username)}</td>
                <td>${esc(r.created_at
                  ? r.created_at.replace('T', ' ').slice(0, 19)
                  : '-')}</td>
                <td>${badge(r.status)}</td>
                <td>${esc(r.reviewed_at
                  ? r.reviewed_at.replace('T', ' ').slice(0, 19)
                  : '-')}</td>
                <td>
                  ${r.status === 'PENDING' ? `
                    <div class="flex">
                      <button type="button"
                        class="ok sm password-review-btn"
                        data-id="${Number(r.id)}"
                        data-status="APPROVED">
                        Approve
                      </button>
                      <button type="button"
                        class="bad sm password-review-btn"
                        data-id="${Number(r.id)}"
                        data-status="REJECTED">
                        Reject
                      </button>
                    </div>
                  ` : '<span class="mut small">Reviewed</span>'}
                </td>
              </tr>
            `).join('') || `
              <tr>
                <td colspan="6">No password-reset requests yet.</td>
              </tr>
            `}
          </tbody>
        </table>
      </div>
    </div>
  `);

  // Attach click handlers after the table has been rendered.
  document.querySelectorAll('.password-review-btn')
    .forEach(button => {
      button.addEventListener('click', () => {
        const id = Number(button.dataset.id);
        const status = button.dataset.status;
        const request = requests.find(
          r => Number(r.id) === id
        );

        if (!request) {
          toast('Request not found. Refresh the page.', 'err');
          return;
        }

        reviewPasswordReset(id, status, request.username);
      });
    });
};

const loadPasswordRequests = wrap(async () => {
  await P.passwordRequests();
  await refreshBadge();
});

const reviewPasswordReset = wrap(async (id, status, username) => {
  const action = status === 'APPROVED' ? 'approve' : 'reject';

  if (!confirm(`${action[0].toUpperCase() + action.slice(1)} password-reset request for ${username}?`)) {
    return;
  }

  const result = await api(
    `/admin/password-reset-requests/${id}/review`,
    'POST',
    { status }
  );

  if (status === 'APPROVED') {
    const temporaryPassword = result.temporary_password;

    if (temporaryPassword) {
      alert(
        `Request approved for ${username}.\n\n` +
        `Temporary password:\n${temporaryPassword}\n\n` +
        `Share it through a trusted channel. Ask the customer ` +
        `to sign in and change it immediately.`
      );
    } else {
      toast('Request approved. Check the server response.', 'ok');
    }
  } else {
    toast(`Password-reset request for ${username} rejected.`, 'ok');
  }

  await P.passwordRequests();
  await refreshBadge();
});

const runAP=wrap(async()=>{const r=await api('/admin/run-autopay','POST',{as_of:$('#ad').value||null,ignore_attempt_limit:$('#ai').checked});
 $('#apres').innerHTML=`<p>${r.processed} processed</p><table>${r.results.map(x=>`<tr><td>Loan ${x.loan_id}</td><td>${esc(x.customer)}</td><td>EMI #${x.installment}</td><td>${badge(x.result)}</td><td class="mut">${esc(x.code||'')}</td></tr>`).join('')}</table>`});
const tog=wrap(async id=>{await api(`/admin/users/${id}/toggle`,'POST');P.admin()});

const resetCustomerPassword = wrap(async (id, username) => {
  const confirmed = confirm(
    `Reset password for ${username}?\nTheir current password will stop working.`
  );

  if (!confirmed) return;

  const result = await api(
    `/admin/users/${id}/reset-password`,
    'POST'
  );

  alert(
    `Temporary password for ${result.username}:\n\n` +
    `${result.temporary_password}\n\n` +
    `Share this with the customer through a trusted channel. ` +
    `Ask them to sign in and change it immediately.`
  );

  P.admin();
});

/* ---------- chat ---------- */
function toggleChat(){const b=$('#chatbox');b.classList.toggle('open');if(b.classList.contains('open')&&!$('#chips').innerHTML){const q=me.role==='CUSTOMER'?['Which loan can I get easily?','Why did my auto-pay fail?','What is my EMI?']:['Show the open queue'];$('#chips').innerHTML=q.map(x=>`<span class="chip" onclick="$('#msg').value=this.textContent;send()">${esc(x)}</span>`).join('')}}
const send=async()=>{const m=$('#msg').value.trim();if(!m)return;$('#msg').value='';const c=$('#chat');c.innerHTML+=`<div class="me">You: ${esc(m)}</div>`;c.scrollTop=1e9;
 try{const r=await api('/agent/chat','POST',{message:m,history:hist.slice(-10)});hist.push({role:'user',text:m},{role:'assistant',text:r.reply});$('#mode').textContent='('+r.mode+')';c.innerHTML+=`<div class="bot"><b>Guardian:</b> ${esc(r.reply)}</div>`;if(r.mode==='action'){refreshBadge()}}catch(e){c.innerHTML+=`<div class="err">${esc(e.message)}</div>`}c.scrollTop=1e9};
boot();
